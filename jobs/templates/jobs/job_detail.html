{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2>{{ object.job_title }}</h2>

    <p><strong>Company:</strong> {{ object.company }}</p>

    <p><strong>Status:</strong> {{ object.status }}</p>

    <p><strong>Location:</strong> {{ object.location | default:"Remote"}}</p>

    <a href="{{ object.job_url }}" target="_blank" class="btn btn-outline-primary">
        Open Original Job
    </a>
    <div class="mt-4">

        <a href="{% url 'jobs:analyze_job' object.pk %}"
        class="btn btn-primary" id="analyzeBtn">
            🤖 Analyze with AI
        </a>

    </div>

</div>

<div id="loadingOverlay"
     class="position-fixed top-0 start-0 w-100 h-100 d-none
            bg-dark bg-opacity-75 d-flex
            justify-content-center align-items-center"
     style="z-index: 9999;">

    <div class="text-center text-white">

        <div class="spinner-border text-light mb-4"
             style="width:4rem;height:4rem;"
             role="status">
        </div>

        <h3>🤖 AI is analyzing this job...</h3>

        <p id="loadingMessage" class="mt-3 text-light">
            Reading the job description...
        </p>

    </div>

</div>

<script>

const messages = [
    "Reading the job description...",
    "Identifying required skills...",
    "Preparing interview questions...",
    "Generating preparation tips...",
    "Almost done..."
];

document.getElementById("analyzeBtn")?.addEventListener("click", function () {

    document.getElementById("loadingOverlay")
            .classList.remove("d-none");

    let i = 0;

    const intervalId = setInterval(() => {

        i++;

        if (i >= messages.length - 1) {
            document.getElementById("loadingMessage").textContent = messages[messages.length - 1];
            clearInterval(intervalId);
            return;
        }

        document.getElementById("loadingMessage").textContent = messages[i];

    }, 1800);

});

</script>

{% endblock %}
