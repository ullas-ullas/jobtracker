services:

  redis:
    image: redis:8.6.5-alpine
    ports:
      - 6379:6379
    restart: unless-stopped

  web:
    build: .

    env_file:
      - .env

    volumes:
      - .:/app
      - static_volume:/app/staticfiles

    depends_on:
      - db
      - redis

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro

    depends_on:
      web:
        condition: service_started

  celery:
    build: .

    command: celery -A jobtracker worker -l info

    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      - db
      - redis

    restart: unless-stopped

  
  celery-beat:
    build: .

    command: celery -A jobtracker beat -l info

    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      - db
      - redis

    restart: unless-stopped


  db:
    image: postgres:17.10-bookworm
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume: